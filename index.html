
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111d">
  <title>ELYX AI - Personal Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #07111d;
      color: #e9fbff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 12px;
    }

    .app {
      width: 100%;
      max-width: 700px;
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      border: 1px solid #16485a;
      border-radius: 18px;
      overflow: hidden;
      background: #0b1927;
      box-shadow: 0 0 30px #00d9ff12;
    }

    header {
      text-align: center;
      padding: 20px;
      background: #0d2232;
      border-bottom: 1px solid #16485a;
    }

    header h1 {
      margin: 0;
      color: #32e6ff;
      letter-spacing: 5px;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      color: #91b7c7;
      font-size: 13px;
    }

    .status {
      color: #63e6a5;
      font-size: 11px;
      margin-top: 8px;
    }

    #chat {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      min-height: 300px;
    }

    .message {
      margin: 12px 0;
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .bot {
      background: #122b3a;
      border-left: 3px solid #32e6ff;
      margin-right: 15px;
    }

    .user {
      background: #123c50;
      border-right: 3px solid #32e6ff;
      margin-left: 15px;
      text-align: right;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 14px;
      border-top: 1px solid #16485a;
      background: #0d2232;
      align-items: center;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #24556a;
      background: #07111d;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 15px;
      background: #32dff5;
      color: #06131d;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .voice-button {
      background: #16485a;
      color: #e9fbff;
      border: 1px solid #32dff5;
      padding: 12px;
    }

    .voice-button.active {
      background: #e64b5d;
      color: white;
      border-color: #e64b5d;
    }

    .clear-button {
      background: transparent;
      color: #91b7c7;
      border: 1px solid #24556a;
      margin-top: 8px;
      font-size: 12px;
    }

    footer {
      text-align: center;
      color: #7896a5;
      padding: 10px;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
      }

      .app {
        min-height: 100vh;
        border-radius: 0;
      }

      header {
        padding: 16px;
      }

      .input-area {
        gap: 6px;
        padding: 10px;
      }

      .input-area input {
        padding: 12px 8px;
      }

      .input-area button {
        padding: 11px 10px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <header>
      <h1>ELYX</h1>
      <p>YOUR PERSONAL AI ASSISTANT</p>
      <div class="status" id="systemStatus">● AI SYSTEM</div>

      <button class="clear-button" id="clearButton">
        Clear Conversation Memory
      </button>
    </header>

    <div id="chat" aria-live="polite"></div>

    <form class="input-area" id="chatForm">

      <input
        id="userInput"
        type="text"
        placeholder="Message ELYX..."
        autocomplete="off"
        maxlength="10000"
        required
      >

      <button
        class="voice-button"
        id="languageButton"
        type="button"
        title="Change recognition language"
      >اردو</button>

      <button
        class="voice-button"
        id="micButton"
        type="button"
        title="Speak to ELYX"
      >🎤</button>

      <button id="sendButton" type="submit">
        Send
      </button>

    </form>

    <div style="text-align:center;padding:8px;background:#0d2232;">
      <button
        class="voice-button"
        id="speakButton"
        type="button"
      >🔊 Speak Last Reply</button>
    </div>

    <footer>ELYX AI • Powered by Gemini</footer>
  </main>

  <script>
    const ELYX_BACKEND =
      "https://elyx-ai-backend.uu254650.workers.dev/";

    const STORAGE_KEY = "elyx_conversation_v1";

    const chat = document.getElementById("chat");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("userInput");
    const sendButton = document.getElementById("sendButton");
    const clearButton = document.getElementById("clearButton");
    const micButton = document.getElementById("micButton");
    const languageButton = document.getElementById("languageButton");
    const speakButton = document.getElementById("speakButton");
    const systemStatus = document.getElementById("systemStatus");

    let conversation = [];
    let lastReply = "";

    // Speech recognition setup
    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition = null;
    let isListening = false;
    let speechLanguage = "ur-PK";

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();

      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.lang = speechLanguage;

      recognition.onstart = function() {
        isListening = true;
        micButton.classList.add("active");
        micButton.textContent = "⏹";
        systemStatus.textContent = "● LISTENING";
      };

      recognition.onresult = function(event) {
        const transcript =
          event.results[0][0].transcript;

        input.value = transcript;
        input.focus();
      };

      recognition.onerror = function(event) {
        let errorMessage = "Microphone error.";

        if (event.error === "not-allowed") {
          errorMessage =
            "Microphone permission denied. Allow microphone access in Chrome.";
        } else if (event.error === "no-speech") {
          errorMessage = "No speech detected. Please try again.";
        } else if (event.error === "network") {
          errorMessage = "Speech recognition needs an internet connection.";
        }

        addMessage(errorMessage, "bot");
      };

      recognition.onend = function() {
        isListening = false;
        micButton.classList.remove("active");
        micButton.textContent = "🎤";
        systemStatus.textContent = "● AI SYSTEM";
      };
    }

    function saveConversation() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(conversation)
        );
      } catch (error) {
        console.error("Memory save error:", error);
      }
    }

    function loadConversation() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) return;

        const parsed = JSON.parse(saved);

        if (!Array.isArray(parsed)) return;

        conversation = parsed
          .filter(item =>
            item &&
            ["user", "model"].includes(item.role) &&
            typeof item.text === "string"
          )
          .slice(-16);

        const previousReply = [...conversation]
          .reverse()
          .find(item => item.role === "model");

        lastReply = previousReply
          ? previousReply.text
          : "";

      } catch (error) {
        conversation = [];
        lastReply = "";
        console.error("Memory load error:", error);
      }
    }

    function addMessage(text, type) {
      const message = document.createElement("div");

      message.className = "message " + type;
      message.textContent = text;

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;

      return message;
    }

    function displayWelcome() {
      chat.innerHTML = "";

      addMessage(
        "Assalam-o-Alaikum! I am ELYX.\n\nمیں آپ کا ذاتی AI اسسٹنٹ ہوں۔ مجھ سے بات کریں!",
        "bot"
      );

      for (const item of conversation) {
        addMessage(
          item.text,
          item.role === "user" ? "user" : "bot"
        );
      }
    }

    async function askELYX(message) {
      const response = await fetch(ELYX_BACKEND, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: message,
          history: conversation.slice(-16)
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.reply || "AI could not answer."
        );
      }

      if (!data.reply || typeof data.reply !== "string") {
        throw new Error("ELYX did not receive a valid reply.");
      }

      return data.reply;
    }

    // Send message to ELYX
    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const text = input.value.trim();

      if (!text || sendButton.disabled) return;

      if (isListening && recognition) {
        recognition.stop();
      }

      addMessage(text, "user");

      input.value = "";
      input.disabled = true;
      sendButton.disabled = true;
      sendButton.textContent = "...";

      const thinking = addMessage(
        "ELYX سوچ رہا ہے...",
        "bot"
      );

      try {
        const reply = await askELYX(text);

        thinking.textContent = reply;
        lastReply = reply;

        conversation.push(
          { role: "user", text: text },
          { role: "model", text: reply }
        );

        conversation = conversation.slice(-16);

        saveConversation();

      } catch (error) {
        thinking.textContent =
          "معاف کریں، ابھی جواب حاصل نہیں ہو سکا۔\n" +
          error.message;

        console.error("ELYX error:", error);

      } finally {
        input.disabled = false;
        sendButton.disabled = false;
        sendButton.textContent = "Send";
        input.focus();
        chat.scrollTop = chat.scrollHeight;
      }
    });

    // Microphone button
    micButton.addEventListener("click", function() {
      if (!recognition) {
        addMessage(
          "آپ کا browser Speech Recognition کو support نہیں کرتا۔ Android پر Chrome استعمال کریں۔",
          "bot"
        );
        return;
      }

      if (isListening) {
        recognition.stop();
        return;
      }

      try {
        recognition.lang = speechLanguage;
        recognition.start();
      } catch (error) {
        addMessage(
          "Microphone شروع نہیں ہو سکا۔ دوبارہ کوشش کریں۔",
          "bot"
        );
      }
    });

    // Switch between Urdu and English recognition
    languageButton.addEventListener("click", function() {
      if (isListening && recognition) {
        recognition.stop();
      }

      if (speechLanguage === "ur-PK") {
        speechLanguage = "en-US";
        languageButton.textContent = "EN";
      } else {
        speechLanguage = "ur-PK";
        languageButton.textContent = "اردو";
      }

      if (recognition) {
        recognition.lang = speechLanguage;
      }
    });

    // Speak the latest ELYX reply
    speakButton.addEventListener("click", function() {
      if (!lastReply) {
        addMessage(
          "ابھی سنانے کے لیے کوئی جواب موجود نہیں ہے۔",
          "bot"
        );
        return;
      }

      if (!("speechSynthesis" in window)) {
        addMessage(
          "آپ کا browser voice output support نہیں کرتا۔",
          "bot"
        );
        return;
      }

      window.speechSynthesis.cancel();

      const utterance =
        new SpeechSynthesisUtterance(lastReply);

      utterance.lang = /[\u0600-\u06FF]/.test(lastReply)
        ? "ur-PK"
        : "en-US";

      utterance.rate = 0.95;
      utterance.pitch = 1;

      window.speechSynthesis.speak(utterance);
    });

    // Clear conversation
    clearButton.addEventListener("click", function() {
      if (!confirm(
        "کیا آپ واقعی اپنی گفتگو کی Memory ختم کرنا چاہتے ہیں؟"
      )) {
        return;
      }

      if (isListening && recognition) {
        recognition.stop();
      }

      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }

      conversation = [];
      lastReply = "";

      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (error) {
        console.error(error);
      }

      displayWelcome();
    });

    // Initialize ELYX
    loadConversation();
    displayWelcome();

  </script>
</body>
</html>
