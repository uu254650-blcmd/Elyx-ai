
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELYX AI</title>
<style>
body{margin:0;background:#07111d;color:white;font-family:Arial;padding:18px}
main{max-width:650px;margin:auto}h1{color:#00e5ff}
input,textarea,button{padding:12px;margin:5px 0;border-radius:9px;border:1px solid #234;background:#102235;color:white}
input,textarea{width:95%}button{cursor:pointer;background:#087e99}
#chat{height:42vh;overflow:auto;background:#0d1c2b;padding:12px;border-radius:12px}
.msg{padding:10px;margin:8px 0;border-radius:10px;background:#173047}
.user{background:#07536a}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>ELYX</h1>
<p>YOUR PERSONAL AI ASSISTANT</p>

<section id="auth">
<h3>Login / Sign Up</h3>
<input id="email" type="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="signup()">Sign Up</button>
<button onclick="login()">Login</button>
<button onclick="resetPass()">Forgot Password</button>
<p id="status"></p>
</section>

<section id="app" class="hidden">
<p id="welcome"></p>
<button onclick="logout()">Logout</button>
<button onclick="newChat()">New Chat</button>
<button onclick="showHistory()">Chat History</button>
<button onclick="clearChat()">Clear Chat</button>
<div id="history" class="hidden"></div>

<div id="chat"></div>
<textarea id="message" placeholder="Message ELYX..."></textarea>
<button onclick="send()">Send</button>
<button onclick="toggleVoice()" id="voiceBtn">Start Voice</button>
<button onclick="changeLanguage()" id="langBtn">Language: Urdu</button>
<p id="voiceStatus"></p>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,
sendEmailVerification,sendPasswordResetEmail,signOut,onAuthStateChanged}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig={
apiKey:"AIzaSyCvenZuBn-GvzyYYgFJB_klaCDmhNGDkqo",
authDomain:"elyx-6b1d2.firebaseapp.com",
projectId:"elyx-6b1d2",
storageBucket:"elyx-6b1d2.firebasestorage.app",
messagingSenderId:"11661998394",
appId:"1:11661998394:web:ebba056d7bab6bcb037803"
};

const appFirebase=initializeApp(firebaseConfig);
const auth=getAuth(appFirebase);
const WORKER="https://elyx-ai-backend.uu254650.workers.dev/";

let user=null,chats=[],active=0,busy=false;
let voiceOn=false,lang="ur-PK";
const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null;

const $=id=>document.getElementById(id);
const key=()=> "elyx_chats_"+user.uid;

function save(){
localStorage.setItem(key(),JSON.stringify(chats));
}
function display(){
$("chat").innerHTML="";
(chats[active]?.messages||[]).forEach(m=>{
const d=document.createElement("div");
d.className="msg "+(m.role==="user"?"user":"");
d.textContent=m.text;
$("chat").appendChild(d);
});
$("chat").scrollTop=$("chat").scrollHeight;
}
function loadChats(){
chats=JSON.parse(localStorage.getItem(key())||"[]");
if(!chats.length){
const old=JSON.parse(localStorage.getItem("elyx_chats_v1")||"[]");
chats=Array.isArray(old)?old:[];
}
if(!chats.length)chats=[{title:"New Chat",messages:[]}];
active=0;save();display();
}

window.signup=async()=>{
try{
const c=await createUserWithEmailAndPassword(auth,$("email").value,$("pass").value);
await sendEmailVerification(c.user);
$("status").textContent="Verification email sent. Verify your email, then login.";
await signOut(auth);
}catch(e){$("status").textContent=e.message}
};

window.login=async()=>{
try{
const c=await signInWithEmailAndPassword(auth,$("email").value,$("pass").value);
if(!c.user.emailVerified){
await sendEmailVerification(c.user);
await signOut(auth);
$("status").textContent="Please verify your email first. Verification email sent.";
}
}catch(e){$("status").textContent=e.message}
};

window.resetPass=async()=>{
try{
await sendPasswordResetEmail(auth,$("email").value);
$("status").textContent="Password reset email sent.";
}catch(e){$("status").textContent=e.message}
};

onAuthStateChanged(auth,async u=>{
if(u&&u.emailVerified){
user=u;$("auth").classList.add("hidden");
$("app").classList.remove("hidden");
$("welcome").textContent="Logged in: "+u.email;
loadChats();
}else{
user=null;$("auth").classList.remove("hidden");
$("app").classList.add("hidden");
}
});

window.logout=()=>{stopVoice();signOut(auth)};

window.newChat=()=>{
chats.unshift({title:"New Chat",messages:[]});
active=0;save();display();showHistory();
};

window.clearChat=()=>{
chats[active].messages=[];
chats[active].title="New Chat";
save();display();showHistory();
};

window.showHistory=()=>{
const h=$("history");
h.classList.toggle("hidden");
h.innerHTML="";
chats.forEach((c,i)=>{
const b=document.createElement("button");
b.textContent=c.title||"Chat "+(i+1);
b.onclick=()=>{active=i;display();h.classList.add("hidden")};
h.appendChild(b);
});
};

async function send(text=null,fromVoice=false){
const input=$("message");
text=(text||input.value).trim();
if(!text||busy)return;
input.value="";
busy=true;
chats[active].messages.push({role:"user",text});
if(chats[active].title==="New Chat")
chats[active].title=text.slice(0,28);
save();display();
try{
const token=await user.getIdToken(true);
const history=chats[active].messages.slice(-20);
const response=await fetch(WORKER,{
method:"POST",
headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
body:JSON.stringify({message:text,history})
});
const data=await response.json();
if(!response.ok)throw Error(data.error||data.reply||"AI request failed");
const reply=data.reply||"Sorry, no reply received.";
chats[active].messages.push({role:"model",text:reply});
save();display();
if(fromVoice&&voiceOn)speak(reply);
else busy=false;
}catch(e){
chats[active].messages.push({role:"model",text:"معاف کریں: "+e.message});
save();display();busy=false;
if(voiceOn)setTimeout(startListening,700);
}
}
window.send=()=>send();

function startListening(){
if(!voiceOn||busy||!recognition)return;
try{recognition.start();$("voiceStatus").textContent="Listening..."}catch(e){}
}
function stopVoice(){
voiceOn=false;busy=false;
if(recognition)try{recognition.stop()}catch(e){}
speechSynthesis.cancel();
$("voiceBtn").textContent="Start Voice";
$("voiceStatus").textContent="Voice stopped";
}
window.toggleVoice=()=>{
if(voiceOn){stopVoice();return}
if(!Speech){
$("voiceStatus").textContent="Voice recognition is not supported. Try Chrome.";
return;
}
voiceOn=true;
recognition=new Speech();
recognition.continuous=false;
recognition.interimResults=false;
recognition.lang=lang;
recognition.onresult=e=>{
const spoken=e.results[0][0].transcript;
send(spoken,true);
};
recognition.onerror=e=>{
$("voiceStatus").textContent="Microphone error: "+e.error;
if(e.error==="not-allowed")stopVoice();
};
recognition.onend=()=>{
if(voiceOn&&!busy)setTimeout(startListening,600);
};
$("voiceBtn").textContent="Stop Voice";
startListening();
};

function speak(text){
speechSynthesis.cancel();
const utterance=new SpeechSynthesisUtterance(text);
utterance.lang=lang;
utterance.rate=.95;
utterance.onend=()=>{
busy=false;
if(voiceOn)setTimeout(startListening,500);
};
utterance.onerror=()=>{
busy=false;
if(voiceOn)setTimeout(startListening,500);
};
speechSynthesis.speak(utterance);
}
window.changeLanguage=()=>{
lang=lang==="ur-PK"?"en-US":"ur-PK";
$("langBtn").textContent=lang==="ur-PK"?"Language: Urdu":"Language: English";
if(recognition)recognition.lang=lang;
};
</script>
</body>
</html>
