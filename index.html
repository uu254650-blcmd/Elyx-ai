
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELYX AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #07111d;
      color: #e9fbff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      min-height: 85vh;
      border: 1px solid #16485a;
      border-radius: 18px;
      overflow: hidden;
      background: #0b1927;
      box-shadow: 0 0 30px #00d9ff12;
    }

    header {
      text-align: center;
      padding: 22px;
      background: #0d2232;
      border-bottom: 1px solid #16485a;
    }

    header h1 {
      margin: 0;
      color: #32e6ff;
      letter-spacing: 5px;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      color: #91b7c7;
      font-size: 13px;
    }

    #chat {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      min-height: 300px;
    }

    .message {
      margin: 12px 0;
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .bot {
      background: #122b3a;
      border-left: 3px solid #32e6ff;
      margin-right: 25px;
    }

    .user {
      background: #123c50;
      border-right: 3px solid #32e6ff;
      margin-left: 25px;
      text-align: right;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 14px;
      border-top: 1px solid #16485a;
      background: #0d2232;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #24556a;
      background: #07111d;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      background: #32dff5;
      color: #06131d;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    footer {
      text-align: center;
      color: #7896a5;
      padding: 10px;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>ELYX</h1>
      <p>YOUR PERSONAL AI ASSISTANT</p>
    </header>

    <div id="chat" aria-live="polite">
      <div class="message bot">Assalam-o-Alaikum! I am ELYX.

میں آپ کا ذاتی AI اسسٹنٹ ہوں۔ مجھ سے بات کریں!</div>
    </div>

    <form class="input-area" id="chatForm">
      <input
        id="userInput"
        type="text"
        placeholder="Message ELYX..."
        autocomplete="off"
        required
      >
      <button id="sendButton" type="submit">Send</button>
    </form>

    <footer>ELYX AI • Powered by Gemini</footer>
  </main>

  <script>
    const ELYX_BACKEND =
      "https://elyx-ai-backend.uu254650.workers.dev/";

    const chat = document.getElementById("chat");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("userInput");
    const sendButton = document.getElementById("sendButton");

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
      return message;
    }

    async function askELYX(message) {
      const response = await fetch(ELYX_BACKEND, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: message
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.details?.error?.message ||
          data.error ||
          "AI سے جواب حاصل نہیں ہو سکا۔"
        );
      }

      if (!data.reply) {
        throw new Error("ELYX کو جواب نہیں ملا۔");
      }

      return data.reply;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";
      input.disabled = true;
      sendButton.disabled = true;
      sendButton.textContent = "...";

      const thinking = addMessage("ELYX سوچ رہا ہے...", "bot");

      try {
        const reply = await askELYX(text);
        thinking.textContent = reply;
      } catch (error) {
        thinking.textContent =
          "معاف کریں، ابھی AI سے رابطہ نہیں ہو سکا۔ دوبارہ کوشش کریں۔";
        console.error("ELYX error:", error);
      } finally {
        input.disabled = false;
        sendButton.disabled = false;
        sendButton.textContent = "Send";
        input.focus();
        chat.scrollTop = chat.scrollHeight;
      }
    });
  </script>
</body>
</html>
